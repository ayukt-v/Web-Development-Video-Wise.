<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Learn It</title>
</head>
<body>

    <h1>To apply form for Coding Competition</h1>
    <!-- FORM -->
     <form action="post">
        <div>
            <!-- div is a block elemen__which is used to give the new space in place of br tag. -->
        <label for="username">Enter Your User Name</label>      
        <input type="text" id="username" name="username" placeholder="Enter your name" autofocus required>
        <!-- autofocus = to stay the cursor at that place -->
         <!-- required is used to mandate the box should be filled by the user. -->
</div>


<div>
      <input type="radio" id="male" name="gender" value="male"> 
          <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female">
      <!-- id=for, if not then it cannot select the radio after tapping on text. -->
           <label for="female">Female</label>
      <!-- If name is same in both cases, then 1 option will select at a time. -->
</div>


<div>
<input type="checkbox" id="subscribe" name="subscribe" value="yes" >
<form for="subscribe">Subscribe to newsletter.</form>
</div>


<div>
    <label for="comment">Enter Your Comment</label><br>
    <textarea id="comment" name="comment" rows="5" cols="100"></textarea>
</div>

<select name="fruits">
    <option value="apple">Apple</option>
<option value="mango">Mango</option>
<option value="banana">Banana</option>
</select>


     </form>
    
</body>
</html>
