    <title>Inline and Block Elements</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Inline elements takes the width which is required, it does not take the new line. -->
    <!-- Block element takes the whole width of screen. -->

    <p>Hey,I am Ayukt.</p>
    <!-- p = block element and next content in next line -->
    <a href="https://www.google.com">Google</a>
    <!-- a = inline elements -->
    <div>I am a block element</div>

    <span>I am same as div tag but I am Inline</span>
    <a href="">Yes, he is inline</a>
